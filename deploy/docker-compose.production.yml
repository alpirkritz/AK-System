# Docker Compose — single host (EC2 / VPS).
# Web runs by default. The WhatsApp bridge is optional (heavy on a 1 GB Free Tier box):
#   web only:        docker compose -f deploy/docker-compose.production.yml up -d --build
#   with bridge:     docker compose -f deploy/docker-compose.production.yml --profile whatsapp up -d --build
# See docs/deploy/ec2-production.md.

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
    ports:
      - '3000:3000'
    volumes:
      - web-data:/data
    env_file:
      - production.env
    environment:
      DATABASE_PATH: /data/ak_system.sqlite
      ABC_ROOT: /app
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3001
    restart: unless-stopped

  whatsapp-bridge:
    profiles:
      - whatsapp
    build:
      context: ..
      dockerfile: apps/whatsapp-bridge/Dockerfile
    ports:
      - '3001:3001'
    volumes:
      - bridge-auth:/data/auth
    env_file:
      - whatsapp-bridge.env
    environment:
      AUTH_STATE_PATH: /data/auth
      PORT: '3001'
    restart: unless-stopped

volumes:
  web-data:
  bridge-auth:
