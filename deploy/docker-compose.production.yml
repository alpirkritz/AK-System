# Docker Compose — single host (EC2 / VPS).
# Web runs by default. The WhatsApp bridge is optional (heavy on a 1 GB Free Tier box):
#   web only:        docker compose -f deploy/docker-compose.production.yml up -d --build
#   with bridge:     docker compose -f deploy/docker-compose.production.yml --profile whatsapp up -d --build
# See docs/deploy/ec2-production.md.

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
    ports:
      - '3000:3000'
    volumes:
      - web-data:/data
      - abc-data:/data/abc
    env_file:
      - production.env
    environment:
      DATABASE_PATH: /data/ak_system.sqlite
      ABC_ROOT: /data/abc
      WHATSAPP_BRIDGE_URL: http://whatsapp-bridge:3001
      WS_NO_BUFFER_UTIL: '1'
      WS_NO_UTF_8_VALIDATE: '1'
    # Reap zombie Chromium after bank scrape; larger shm for Puppeteer (also pass --disable-dev-shm-usage).
    init: true
    shm_size: '256mb'
    restart: unless-stopped

  whatsapp-bridge:
    profiles:
      - whatsapp
    build:
      context: ..
      dockerfile: apps/whatsapp-bridge/Dockerfile
    ports:
      - '3001:3001'
    volumes:
      - bridge-auth:/data/auth
      # Separate volume on purpose — clearing bridge-auth to force a new QR must not
      # wipe the capture lists. See docs/specs/bridge-config-outside-auth-state.md.
      - bridge-config:/data/config
    env_file:
      - whatsapp-bridge.env
    environment:
      AUTH_STATE_PATH: /data/auth
      BRIDGE_CONFIG_PATH: /data/config
      PORT: '3001'
      AK_GROUP_SUMMARY_URL: http://web:3000/api/whatsapp/group-summary
      AK_GROUP_CLUSTER_SUMMARY_URL: http://web:3000/api/whatsapp/group-cluster-summary
      AK_MESSAGES_INGEST_URL: http://web:3000/api/whatsapp/messages/ingest
    restart: unless-stopped

volumes:
  web-data:
  abc-data:
  bridge-auth:
  bridge-config:
