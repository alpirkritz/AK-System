# DISABLED — cron runs on the EC2 instance via scripts/install-server-cron.sh
# (deploy/crontab.example → localhost:3000). See docs/deploy/cron-setup.md.
#
# Manual debug only. Requires GitHub secrets APP_URL + CRON_SECRET matching production.

name: Production Cron

on:
  workflow_dispatch:
    inputs:
      endpoint:
        description: 'Cron endpoint path'
        required: true
        type: choice
        options:
          - /api/cron/morning-briefing
          - /api/cron/calendar-sync
          - /api/cron/daily-meeting-summary
          - /api/cron/pre-meeting-briefing
          - /api/cron/task-reminder
          - /api/cron/feed-sync
          - /api/cron/whatsapp-group-summary
          - /api/cron/agent-triggers
        default: '/api/cron/morning-briefing'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call cron endpoint
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}${{ github.event.inputs.endpoint }}"
